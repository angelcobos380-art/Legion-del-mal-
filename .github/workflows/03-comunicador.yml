
name: Comunicador de la legion 

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Que villano envia el mensaj?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - The Joker
          - Reverse Flash
          - Brainiac

      cowsay_character:
        description: "Tipos de cows"
        required: true
        type: choice
        options:
          - dragon
          - dolphin 
          - ghostbusters
          - fox

      mensaje: 
        description: "Mensaje para el consejo"
        required: true
        default: "La mision fue un exito"

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟠 Alta
          - 🔴 Critica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la legion
        run: sudo apt-get install -y cowsay


      - name: Imprimir inputs
        run: |
          echo "=============================="
          echo "    Transmision interceptada"
          echo "=============================="
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:&M UTC")"
          echo "------ Mensaje ------"
          cowsay -f "${{ inputs.cowsay_character }}" "${{ inputs.mensaje }}"
          echo ""
          echo "--- ${{ inputs.villano }}"
          echo " ..."

