
name: Comunicador de la legion 

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Que villano envia el mensaj?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - The Joker
          - Reverse Flash
          - Brainiac

      mensaje: 
        description: "Mensaje para el consejo"
        required: true
        default: "La mision fue un exito"

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟠 Alta
          - 🔴 Critica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
